<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">ClipForge — your footage, your audience, your edit</title>
  <desc id="description">A charcoal and pale-blue ClipForge banner with a film timeline illustration.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101317"/><stop offset="1" stop-color="#1d303d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#88c0d0"/><stop offset="1" stop-color="#d0e7f2"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#background)"/>
  <g fill="none" stroke="#b8d7e8" stroke-width="5" stroke-linecap="round">
    <circle cx="88" cy="73" r="12"/><circle cx="88" cy="109" r="12"/>
    <path d="m100 81 38 40m-38-20 38-40"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="168" y="105" font-size="58" font-weight="750" letter-spacing="-2" fill="#f5f5f7">ClipForge</text>
    <text x="72" y="176" font-size="28" font-weight="550" fill="#d0e7f2">Your footage. Your audience. Your edit.</text>
    <text x="72" y="217" font-size="18" fill="#a8bdca">A local-first studio for highlights, captions, and short-form stories.</text>
    <text x="72" y="267" font-size="14" font-weight="650" letter-spacing="2" fill="#88c0d0">OPEN SOURCE  ·  REVIEWABLE AI  ·  MP4 EXPORT</text>
  </g>
  <g transform="translate(830 72)">
    <rect width="365" height="172" rx="15" fill="#101a22" stroke="#3e5665"/>
    <g fill="#264454">
      <rect x="18" y="18" width="96" height="81" rx="8"/>
      <rect x="126" y="18" width="96" height="81" rx="8"/>
      <rect x="234" y="18" width="113" height="81" rx="8"/>
    </g>
    <path d="m42 77 18-28 14 17 15-9 11 20m42-13 17-15 18 30 19-23m54 12 20-25 15 13 19-7 15 28" fill="none" stroke="#88c0d0" stroke-width="4" stroke-linecap="round"/>
    <rect x="18" y="117" width="329" height="12" rx="6" fill="#293c49"/>
    <rect x="92" y="117" width="135" height="12" rx="6" fill="url(#accent)"/>
    <path d="M92 108v30m135-30v30" stroke="#d0e7f2" stroke-width="3"/>
    <text x="18" y="154" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#b0bec8">SOURCE → AUDIENCE FIT → STORY</text>
  </g>
</svg>
